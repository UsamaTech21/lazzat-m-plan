<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Lazzat — 25-Post Content Calendar</title>
<link rel="icon" href="/favicon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="/favicon.svg">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&family=Outfit:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="responsive.css">
<style>
  :root {
    --bg: #fdfcfb;
    --text: #2d2d2d;
    --text-muted: #666;
    --accent: #b5341a;
    --accent-soft: #f8e9e6;
    --gold: #c8960c;
    --border: #eceae6;
    --shadow: 0 4px 20px rgba(0,0,0,0.03);
  }

  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    font-family: 'Inter', -apple-system, sans-serif;
    background: var(--bg);
    color: var(--text);
    line-height: 1.6;
    -webkit-font-smoothing: antialiased;
  }

  .back-btn {
    display: inline-flex;
    align-items: center;
    gap: 8px;
    padding: 10px 18px;
    background: #fff;
    border: 1px solid var(--border);
    border-radius: 100px;
    color: var(--text-muted);
    text-decoration: none;
    font-size: 12px;
    font-weight: 600;
    text-transform: uppercase;
    letter-spacing: 1px;
    box-shadow: var(--shadow);
    transition: all 0.2s;
  }
  .back-btn:hover { color: var(--accent); border-color: var(--accent); transform: translateX(-4px); }

  .page { max-width: 1400px; margin: 0 auto; padding: 24px 20px 40px; }

  .cal-header {
    margin-bottom: 20px;
    display: flex;
    flex-wrap: wrap;
    align-items: flex-end;
    justify-content: space-between;
    gap: 16px;
  }

  .cal-header h1 {
    font-family: 'Outfit', sans-serif;
    font-size: clamp(24px, 5vw, 32px);
    font-weight: 700;
    letter-spacing: -0.5px;
    margin-bottom: 6px;
  }

  .cal-header p {
    font-size: 14px;
    color: var(--text-muted);
    max-width: 560px;
  }

  .open-sheet-btn {
    display: inline-flex;
    align-items: center;
    gap: 8px;
    padding: 12px 22px;
    background: var(--accent);
    color: #fff;
    border-radius: 100px;
    font-size: 12px;
    font-weight: 700;
    text-transform: uppercase;
    letter-spacing: 0.5px;
    text-decoration: none;
    box-shadow: 0 4px 14px rgba(181, 52, 26, 0.25);
    transition: opacity 0.2s;
    white-space: nowrap;
  }
  .open-sheet-btn:hover { opacity: 0.9; }

  .sheet-wrap {
    background: #fff;
    border: 1px solid var(--border);
    border-radius: 16px;
    overflow: hidden;
    box-shadow: var(--shadow);
    min-height: 70vh;
  }

  .sheet-embed {
    display: block;
    width: 100%;
    height: min(80vh, 900px);
    min-height: 480px;
    border: 0;
  }

  .sheet-fallback {
    padding: 40px 24px;
    text-align: center;
    color: var(--text-muted);
    font-size: 14px;
  }

  .sheet-fallback a {
    color: var(--accent);
    font-weight: 600;
  }

  @media (max-width: 600px) {
    .page { padding: 16px 12px 32px; }
    .cal-header { flex-direction: column; align-items: flex-start; }
    .open-sheet-btn { width: 100%; justify-content: center; }
    .sheet-embed { min-height: 420px; height: 65vh; }
  }
</style>
</head>
<body>

<div class="page">
  <a href="index.html#s9" class="back-btn">← Back to Master Plan</a>

  <header class="cal-header" style="margin-top: 20px;">
    <div>
      <h1>Lazzat — 25 Post Content Calendar</h1>
      <p>Live calendar in Google Sheets — status, dates, captions, and visual direction for every post.</p>
    </div>
    <a
      class="open-sheet-btn"
      href="https://docs.google.com/spreadsheets/d/1jmFslA_GMkvpUL0WMEDsuFJmWy2-z5Kw7siyW0etoB0/edit?usp=sharing"
      target="_blank"
      rel="noopener noreferrer"
    >Open in Google Sheets ↗</a>
  </header>

  <div class="sheet-wrap">
    <iframe
      class="sheet-embed"
      title="Lazzat content calendar"
      src="https://docs.google.com/spreadsheets/d/1jmFslA_GMkvpUL0WMEDsuFJmWy2-z5Kw7siyW0etoB0/htmlembed?widget=true&amp;headers=false"
      loading="lazy"
      allowfullscreen
    ></iframe>
    <p class="sheet-fallback">
      If the calendar does not load, <a href="https://docs.google.com/spreadsheets/d/1jmFslA_GMkvpUL0WMEDsuFJmWy2-z5Kw7siyW0etoB0/edit?usp=sharing" target="_blank" rel="noopener noreferrer">open it directly in Google Sheets</a>.
    </p>
  </div>
</div>

</body>
</html>
