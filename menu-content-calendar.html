<style>
  :root {
    --bg: #fdfcfb;
    --text: #2d2d2d;

    --color-background-primary: #ffffff;

    --color-text-primary: #2d2d2d;
    --color-text-secondary: #666;
    --color-text-tertiary: #999;
    --color-text-info: #b5341a;
    --color-border-primary: #b5341a;
    --color-border-secondary: #ddd;
    --color-border-tertiary: #eceae6;
    --border-radius-lg: 16px;
    --border-radius-md: 8px;
    --font-sans: 'Inter', sans-serif;
  }

  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { 
    font-family: var(--font-sans); 
    background: var(--bg); 
    color: var(--text); 
    font-size: 16px; 
    line-height: 1.8; 
    -webkit-font-smoothing: antialiased;
  }

  .main-container { max-width: 1200px; margin: 0 auto; padding: 60px 20px 100px; }
  


  .cal-wrap { padding: 1.5rem 0; font-family: var(--font-sans); }
  .cal-header { margin-bottom: 2.5rem; }
  .cal-header h2 { font-family: 'Outfit', sans-serif; font-size: 32px; font-weight: 700; color: var(--color-text-primary); margin: 0 0 8px; letter-spacing: -0.5px; }
  .cal-header p { font-size: 15px; color: var(--color-text-secondary); margin: 0; }
  
  .legend { display: flex; flex-wrap: wrap; gap: 12px; margin-bottom: 2rem; padding: 20px; background: #fff; border: 1px solid var(--border); border-radius: 12px; box-shadow: var(--shadow); }
  .legend-item { display: flex; align-items: center; gap: 8px; font-size: 11px; font-weight: 700; color: var(--color-text-secondary); text-transform: uppercase; letter-spacing: 0.5px; }
  .legend-dot { width: 10px; height: 10px; border-radius: 50%; flex-shrink: 0; }
  


  .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); gap: 20px; }
  .card { background: var(--color-background-primary); border: 1px solid var(--color-border-tertiary); border-radius: var(--border-radius-lg); padding: 24px; cursor: pointer; transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1); position: relative; box-shadow: var(--shadow); }
  .card:hover { border-color: var(--accent); transform: translateY(-4px); box-shadow: 0 12px 30px rgba(0,0,0,0.06); }
  .card-top { display: flex; justify-content: space-between; align-items: flex-start; margin-bottom: 16px; }
  .post-num { font-family: 'Outfit', sans-serif; font-size: 11px; font-weight: 800; color: var(--color-text-tertiary); letter-spacing: 2px; text-transform: uppercase; }
  .cat-pill { font-size: 10px; font-weight: 800; padding: 4px 12px; border-radius: 100px; text-transform: uppercase; letter-spacing: 0.5px; }
  .card-title { font-family: 'Outfit', sans-serif; font-size: 18px; font-weight: 700; color: var(--color-text-primary); margin: 0 0 10px; line-height: 1.3; }
  .card-hook { font-size: 14px; color: var(--color-text-secondary); line-height: 1.6; margin: 0 0 16px; }
  .card-tag { font-size: 11px; color: var(--accent); font-weight: 700; text-transform: uppercase; letter-spacing: 1px; display: flex; align-items: center; gap: 6px; }
  .card-tag::after { content: "↓"; font-size: 14px; }
  
  .detail-box { margin-top: 20px; padding-top: 20px; border-top: 1px solid var(--color-border-tertiary); display: none; animation: slideDown 0.3s ease-out; }
  .card.open { border-color: var(--accent); ring: 2px solid var(--accent-soft); }
  .card.open .card-tag { display: none; }
  .card.open .detail-box { display: block; }
  
  @keyframes slideDown { from { opacity: 0; transform: translateY(-10px); } to { opacity: 1; transform: translateY(0); } }
  
  .detail-row { margin-bottom: 16px; font-size: 13px; }
  .detail-label { display: block; color: var(--color-text-tertiary); font-weight: 800; font-size: 10px; text-transform: uppercase; letter-spacing: 1px; margin-bottom: 4px; }
  .detail-val { color: var(--color-text-primary); line-height: 1.6; display: block; }
  


  @media (max-width: 768px) {
    .main-container { padding: 56px 16px 60px; }
    .grid { grid-template-columns: 1fr; }
    .cal-header h2 { font-size: 24px; }
    .cal-header p { font-size: 14px; }
    .legend { padding: 14px; gap: 8px; }
    .legend-item { font-size: 10px; }
    .card { padding: 18px; }
    .card-title { font-size: 16px; }
  }

  @media (max-width: 480px) {
    .back-btn.fixed-back { position: static; display: inline-flex; margin: 12px 0 0; }

  .back-btn:hover { color: var(--accent); transform: translateX(-4px); }
</style>

function renderLegend() {
  const leg = document.getElementById("legend");
  leg.innerHTML = "";
  Object.entries(cats).forEach(([name, col]) => {
    const item = document.createElement("div");
    item.className = "legend-item";
    item.innerHTML = `<span class="legend-dot" style="background:${col.bg}"></span>${name}`;
    leg.appendChild(item);
  });
}

function renderGrid() {
  const grid = document.getElementById("grid");
  grid.innerHTML = "";
  const filtered = posts;
  filtered.forEach((p, i) => {
    const idx = posts.indexOf(p) + 1;
    const col = cats[p.cat];
    const card = document.createElement("div");
    card.className = "card";
    card.innerHTML = `
      <div class="card-top">
        <span class="post-num">POST ${String(idx).padStart(2,"0")}</span>
        <span class="cat-pill" style="background:${col.bg};color:${col.text}">${p.cat}</span>
      </div>
      <p class="card-title">${p.title}</p>
      <p class="card-hook">${p.hook}</p>
      <span class="card-tag">Expand Post Details</span>
      <div class="detail-box">
        <div class="detail-row"><span class="detail-label">Visual Direction</span><span class="detail-val">${p.visual}</span></div>
        <div class="detail-row"><span class="detail-label">Caption Draft</span><span class="detail-val">${p.caption}</span></div>
        <div class="detail-row"><span class="detail-label">Pro Tip</span><span class="detail-val">${p.tip}</span></div>

      </div>
    `;
    card.onclick = () => {
      const isOpen = card.classList.contains("open");
      document.querySelectorAll(".card.open").forEach(c => c.classList.remove("open"));
      if (!isOpen) card.classList.add("open");
    };
    grid.appendChild(card);
  });
}
